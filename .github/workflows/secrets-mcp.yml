# Typecheck, test and build the local Dumont Secrets MCP (mcp/) on the Node
# versions it supports, and syntax-check its installer. Nothing is deployed:
# each person installs it on their own machine (mcp/scripts/install-local.sh).
name: Secrets MCP
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - ".github/workflows/secrets-mcp.yml"
      - "mcp/**"
  pull_request:
    paths:
      - ".github/workflows/secrets-mcp.yml"
      - "mcp/**"

defaults:
  run:
    shell: bash
    working-directory: mcp

jobs:
  check:
    name: Typecheck, test, build (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Installer syntax
        run: bash -n scripts/install-local.sh

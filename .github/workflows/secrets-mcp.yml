# Typecheck, test and build the Dumont Secrets MCP (mcp/). No deploy job:
# production is delivered from main by deploy/vault-syd1-mcp/deliver-to-vault-syd1.sh.
name: Secrets MCP
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - ".github/workflows/secrets-mcp.yml"
      - "mcp/**"
      - "deploy/vault-syd1-mcp/**"
  pull_request:
    paths:
      - ".github/workflows/secrets-mcp.yml"
      - "mcp/**"
      - "deploy/vault-syd1-mcp/**"

defaults:
  run:
    shell: bash
    working-directory: mcp

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Shell syntax of the delivery scripts
        working-directory: deploy/vault-syd1-mcp
        run: |
          bash -n deliver-to-vault-syd1.sh
          bash -n apply-on-vault-syd1.sh

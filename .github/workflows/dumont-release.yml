# DumontAI fork only: publish pinned vault images to GHCR on dumont tags.
# Tag pattern: vYYYY.M.P-N-dumont.X  (example: v2026.7.1-1-dumont.1)
name: Dumont Release

on:
  push:
    tags:
      - 'v*-dumont.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image/git tag to build (must exist locally after checkout)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    if: github.repository == 'DumontAI/dumont-secrets'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/dumontai/dumont-secrets-oidcwarden:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ghcr.io/dumontai/dumont-secrets-oidcwarden:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize
        run: |
          echo "Published ${{ steps.meta.outputs.image }}"
          echo "Pull on vault-syd1:"
          echo "  docker pull ${{ steps.meta.outputs.image }}"
          echo "  docker tag ${{ steps.meta.outputs.image }} dumont-secrets-oidcwarden:${{ steps.meta.outputs.tag }}"

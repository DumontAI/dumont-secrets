name: dumont-secrets

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dumont_secrets
      POSTGRES_USER: dumont_secrets
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dumont_secrets"]
      interval: 10s
      timeout: 5s
      retries: 5

  oidcwarden:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://dumont_secrets:${DB_PASSWORD}@postgres:5432/dumont_secrets
      # Admin panel
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      # Domain
      DOMAIN: https://secret.getdumont.ai
      # SSO / OIDC
      SSO_ENABLED: "true"
      SSO_ONLY: "true"
      SSO_AUTHORITY: https://auth.getdumont.ai
      SSO_CLIENT_ID: ${SSO_CLIENT_ID}
      SSO_CLIENT_SECRET: ""
      SSO_PKCE: "true"
      SSO_SCOPES: "openid profile email"
      SSO_AUTHORIZATION_CODE_FLOW: "true"
      # Email (via Resend SMTP bridge)
      SMTP_HOST: smtp.resend.com
      SMTP_PORT: "587"
      SMTP_SECURITY: starttls
      SMTP_USERNAME: resend
      SMTP_PASSWORD: ${RESEND_API_KEY}
      SMTP_FROM: noreply@getdumont.ai
      SMTP_FROM_NAME: Dumont Secrets
      # Application settings
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      PASSWORD_HINTS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      LOG_LEVEL: info
      EXTENDED_LOGGING: "false"
      # Rocket web server
      ROCKET_PORT: "8080"
      ROCKET_WORKERS: "4"
    ports:
      - "127.0.0.1:8092:8080"
    volumes:
      - data:/data

volumes:
  postgres-data:
  data:
